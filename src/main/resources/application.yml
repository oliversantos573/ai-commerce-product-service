spring:

  datasource:

    url: jdbc:postgresql://localhost:5432/productdb

    username: postgres

    password: postgres

    driver-class-name: org.postgresql.Driver

  jpa:

    open-in-view: false

    hibernate:

      ddl-auto: validate

    properties:

      hibernate:

        format_sql: true

  flyway:

    enabled: true

    locations: classpath:db/migration

springdoc:

  swagger-ui:

    path: /swagger

  api-docs:

    path: /api-docs